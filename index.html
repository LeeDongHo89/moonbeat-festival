<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#241527">
    <title>Moonbeat Festival</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">MOONBEAT FESTIVAL</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      function unityShowBanner(message, type) {
        var warning = document.querySelector("#unity-warning");
        var item = document.createElement("div");
        item.textContent = message;
        item.className = type || "warning";
        warning.appendChild(item);
        if (type !== "error") setTimeout(function () { item.remove(); }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Codex Studio",
        productName: "Moonbeat Festival",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      var isMobile = (navigator.userAgentData && navigator.userAgentData.mobile)
        || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || "")
        || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      document.documentElement.classList.toggle("mobile", !!isMobile);
      if (!isMobile) document.documentElement.classList.add("desktop");
      if (isMobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      ["contextmenu", "gesturestart", "gesturechange", "gestureend"].forEach(function (eventName) {
        canvas.addEventListener(eventName, function (event) { event.preventDefault(); });
      });
      canvas.addEventListener("touchmove", function (event) { event.preventDefault(); }, { passive: false });

      loadingBar.style.display = "flex";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (progress * 100) + "%";
        }).then(function () {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
